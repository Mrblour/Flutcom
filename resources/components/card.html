<div class="bg-white rounded-3xl p-6 border border-zinc-200/80 shadow-sm hover:shadow-md hover:-translate-y-0.5 transition-all flex flex-col justify-between">
  <div>
    <div class="flex items-center justify-between mb-4">
      <span class="w-10 h-10 rounded-2xl bg-zinc-100 flex items-center justify-center text-zinc-900">
        <i class="{{ icon }} text-lg"></i>
      </span>
      <span class="text-xs font-semibold px-2.5 py-1 bg-zinc-100 text-zinc-600 rounded-full">{{ badge }}</span>
    </div>
    <h3 class="text-zinc-900 font-bold text-lg mb-1 tracking-tight">{{ title }}</h3>
    <p class="text-zinc-500 text-sm leading-relaxed mb-4">{{ description }}</p>
  </div>
  <div class="pt-3 border-t border-zinc-100">
    {{ slot }}
  </div>
</div>
