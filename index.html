<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Flutcom</title>
  <meta name="description" content="The lightweight SPA framework for static sites.">
  <meta name="theme-color" content="#000000">

  <!-- Framework CSS Core -->
  <link rel="stylesheet" href="assets/css/flutcom.css">
  
  <!-- Tu CSS Base -->
  <link rel="stylesheet" href="assets/css/style.css">

  <!-- Tailwind CSS (Compiled for Production) -->
  <link rel="stylesheet" href="assets/vendor/tailwind/tailwind.css">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="shortcut icon" href="assets/img/flutcom.svg" type="image/svg+xml">
</head>

<body>
  <!-- Application Main Shell -->
  <div class="app-shell">
    <div id="navbar"></div>
    
    <main id="content">
      <!-- Flutcom will inject views here -->
    </main>
    
    <div id="footer"></div>
  </div>

  <!-- Framework Boot -->
  <script type="module" src="flutcom/main.js"></script>
</body>

</html>
