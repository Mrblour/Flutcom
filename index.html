<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Flutcom — Lightweight SPA Framework for Static Sites</title>

  <meta name="theme-color" content="#ffffff">

  <link rel="icon" href="assets/img/flutcom.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/vendor/tailwind/tailwind.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/flutcom.css">
</head>

<body>
  <div class="app-shell">
    <flut-navbar></flut-navbar>
    <flut-main role="main" aria-live="polite" aria-label="Contenido de la vista actual"></flut-main>
    <flut-footer></flut-footer>
  </div>

  <script type="module" src="flutcom/main.js"></script>
</body>

</html>
