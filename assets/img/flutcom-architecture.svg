<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" fill="none">
  <defs>
    <style>
      .box { fill: #ffffff; stroke: #e5e7eb; stroke-width: 1.5; rx: 12px; }
      .box-dark { fill: #000000; rx: 12px; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; letter-spacing: -0.2px; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #6b7280; font-weight: 400; }
      .desc-dark { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #9ca3af; font-weight: 400; }
      .tag { font-family: monospace; font-size: 10px; font-weight: 600; }
      .arrow { stroke: #9ca3af; stroke-width: 1.5; stroke-dasharray: 4 4; }
      .arrow-head { fill: #9ca3af; }
    </style>
  </defs>

  <!-- Step 1: Shell -->
  <g transform="translate(20, 30)">
    <rect width="180" height="170" class="box"/>
    <rect x="16" y="16" width="32" height="32" rx="8" fill="#f3f4f6"/>
    <text x="26" y="37" font-size="16">🏛️</text>
    <text x="56" y="32" fill="#111827" class="title">Declarative Shell</text>
    <text x="56" y="47" class="desc">index.html Layout</text>
    <line x1="16" y1="65" x2="164" y2="65" stroke="#f3f4f6" stroke-width="1"/>
    <text x="16" y="85" fill="#4b5563" class="tag">&lt;flut-navbar&gt;</text>
    <text x="16" y="105" fill="#4b5563" class="tag">&lt;flut-main&gt;</text>
    <text x="16" y="125" fill="#4b5563" class="tag">&lt;flut-footer&gt;</text>
    <text x="16" y="152" class="desc">Persistent partials &amp; slots</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <path d="M 205 115 L 245 115" class="arrow"/>
  <polygon points="245,112 252,115 245,118" class="arrow-head"/>

  <!-- Step 2: Router -->
  <g transform="translate(255, 30)">
    <rect width="180" height="170" class="box"/>
    <rect x="16" y="16" width="32" height="32" rx="8" fill="#f3f4f6"/>
    <text x="26" y="37" font-size="16">⚡</text>
    <text x="56" y="32" fill="#111827" class="title">Hash Router</text>
    <text x="56" y="47" class="desc">flutcom.config.js</text>
    <line x1="16" y1="65" x2="164" y2="65" stroke="#f3f4f6" stroke-width="1"/>
    <text x="16" y="85" fill="#111827" class="desc" font-weight="600">• Auto-guards &amp; hooks</text>
    <text x="16" y="105" fill="#111827" class="desc" font-weight="600">• Dynamic SEO sync</text>
    <text x="16" y="125" fill="#111827" class="desc" font-weight="600">• Zero prototype pollution</text>
    <text x="16" y="152" class="desc">Smooth async transitions</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <path d="M 440 115 L 480 115" class="arrow"/>
  <polygon points="480,112 487,115 480,118" class="arrow-head"/>

  <!-- Step 3: Plugins -->
  <g transform="translate(490, 30)">
    <rect width="180" height="170" class="box"/>
    <rect x="16" y="16" width="32" height="32" rx="8" fill="#f3f4f6"/>
    <text x="26" y="37" font-size="16">🧩</text>
    <text x="56" y="32" fill="#111827" class="title">Plugin Sandbox</text>
    <text x="56" y="47" class="desc">plugins/&lt;name&gt;/</text>
    <line x1="16" y1="65" x2="164" y2="65" stroke="#f3f4f6" stroke-width="1"/>
    <text x="16" y="85" fill="#111827" class="desc" font-weight="600">• Zero-Code .json setup</text>
    <text x="16" y="105" fill="#111827" class="desc" font-weight="600">• Isolated modular scope</text>
    <text x="16" y="125" fill="#111827" class="desc" font-weight="600">• Lifecycle onNavigate()</text>
    <text x="16" y="152" class="desc">Zero global pollution</text>
  </g>

  <!-- Arrow 3 to 4 -->
  <path d="M 675 115 L 715 115" class="arrow"/>
  <polygon points="715,112 722,115 715,118" class="arrow-head"/>

  <!-- Step 4: Reactive Engine (Dark Card Hero) -->
  <g transform="translate(725, 30)">
    <rect width="160" height="170" class="box-dark"/>
    <rect x="16" y="16" width="32" height="32" rx="8" fill="#222222"/>
    <text x="26" y="37" font-size="16">💎</text>
    <text x="56" y="32" fill="#ffffff" class="title">DOM Engine</text>
    <text x="56" y="47" class="desc-dark">Direct Reactivity</text>
    <line x1="16" y1="65" x2="144" y2="65" stroke="#222222" stroke-width="1"/>
    <text x="16" y="85" fill="#38bdf8" class="tag">&lt;flut-*&gt; slots</text>
    <text x="16" y="105" fill="#4ade80" class="tag">fc-model / fc-bind</text>
    <text x="16" y="125" fill="#facc15" class="tag">fc-show / fc-click</text>
    <text x="16" y="152" fill="#9ca3af" class="desc-dark">Zero Virtual-DOM tax</text>
  </g>
</svg>
